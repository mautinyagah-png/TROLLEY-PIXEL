<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TROLLEY PIXEL</title>
<style>
  html,body{
    margin:0;height:100%;background:#08080a;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  canvas{
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#121216;
    box-shadow:0 0 0 3px #2b2b2b, 0 0 60px #000;
    display:block;
  }
</style>
</head>
<body>
<canvas id="c" width="640" height="360"></canvas>
<script>
"use strict";

/* ============================================================
   TROLLEY PIXEL  —  Level Devil style trap platformer
   Pure HTML5 / CSS3 / JS  •  Volatile memory only
   ============================================================ */

const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 640, H = 360, T = 20;

/* ---------- responsive integer scaling ---------- */
function fit(){
  const s = Math.max(1, Math.min(
    Math.floor(window.innerWidth  / W),
    Math.floor(window.innerHeight / H)
  ));
  cv.style.width  = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fit);
fit();

/* ============================================================
   TUNING
   ============================================================ */
const GRAV     = 0.60;
const MAXFALL  = 11.0;
const SPEED    = 2.90;
const ACCEL    = 0.90;
const FRIC     = 0.75;
const JUMP     = 9.20;
const STEP     = 1 / 60;

/* ============================================================
   INPUT
   ============================================================ */
const keys = Object.create(null);
let jumpBuffer = 0;

window.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') jumpBuffer = 7;
    if (e.code === 'KeyR') {
      if (gameState === 'victory') { gameState = 'play'; levelIndex = 0; deaths = 0; buildLevel(); }
      else { kill(); }
    }
  }
  keys[e.code] = true;
}, { passive:false });

window.addEventListener('keyup', e => { keys[e.code] = false; });

/* ============================================================
   UTIL
   ============================================================ */
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const overlap = (a,b) =>
  a.x < b.x + b.w && a.x + a.w > b.x &&
  a.y < b.y + b.h && a.y + a.h > b.y;

/* ============================================================
   LEVEL GRID HELPERS
   ============================================================ */
function newGrid(){
  const g = [];
  for (let r = 0; r < 18; r++) g.push(new Array(32).fill('.'));
  return g;
}
function fillR(g, c0, r0, c1, r1, ch){
  ch = ch || '#';
  for (let r = r0; r <= r1; r++)
    for (let c = c0; c <= c1; c++)
      if (g[r] && c >= 0 && c < 32) g[r][c] = ch;
}
function gridStr(g){ return g.map(r => r.join('')); }

/* ============================================================
   LEVEL DEFINITIONS
   ============================================================ */
const LEVELS = [];

/* ---------- STAGE 1 : THE FALSE SECURITY ---------- */
(function(){
  const g = newGrid();
  fillR(g, 0, 16, 31, 17);
  fillR(g, 14, 16, 16, 17, '.');          // the innocent-looking gap
  LEVELS.push({
    name: 'THE FALSE SECURITY',
    grid: gridStr(g),
    spawn: { x: 40, y: 304 },
    door:  { x: 560, y: 288 },
    traps: [
      { type:'jump', x: 340, baseY: 320, w: 20, h: 26, radius: 95 }
    ]
  });
})();

/* ---------- STAGE 2 : THE SHRINKING CORRIDOR ---------- */
(function(){
  const g = newGrid();
  fillR(g, 0, 16, 31, 17);
  fillR(g, 23, 16, 25, 17, '.');          // hole for the drop-floor
  LEVELS.push({
    name: 'THE SHRINKING CORRIDOR',
    grid: gridStr(g),
    spawn: { x: 40, y: 304 },
    door:  { x: 580, y: 288 },
    traps: [
      // intimidation crusher that slams behind you
      { type:'crush', x: 100, w: 100, h: 220, upY: -220, downY: 100,
        triggerX: 260, once: true },
      // the real, cycling crusher in front
      { type:'crush', x: 340, w: 60, h: 160, upY: 80, downY: 160,
        triggerX: 200, once: false },
      // the floor that lies
      { type:'drop', x: 460, y: 320, w: 60, h: 40, delay: 0.35 }
    ]
  });
})();

/* ---------- STAGE 3 : THE DOOR THAT RUNS AWAY ---------- */
(function(){
  const g = newGrid();
  fillR(g, 0, 16, 31, 17);
  fillR(g, 14, 16, 16, 17, '.');
  fillR(g, 20, 13, 22, 13);               // P1
  fillR(g, 24, 10, 26, 10);               // P2
  fillR(g, 28,  7, 31,  7);               // P3 (door's new home)
  g[15][9]  = '^';
  g[15][10] = '^';
  LEVELS.push({
    name: 'THE DOOR THAT RUNS AWAY',
    grid: gridStr(g),
    spawn: { x: 40, y: 304 },
    door:  { x: 560, y: 288 },
    doorFlees: { x: 580, y: 108 },
    traps: [
      { type:'jump', x: 360, baseY: 320, w: 20, h: 26, radius: 85 }
    ]
  });
})();

/* ---------- STAGE 4 : THE INVISIBLE MAZE ---------- */
(function(){
  const g = newGrid();
  fillR(g, 0, 16, 5, 17);                 // start ledge
  fillR(g, 27, 16, 31, 17);               // end ledge
  LEVELS.push({
    name: 'THE INVISIBLE MAZE',
    grid: gridStr(g),
    spawn: { x: 40, y: 304 },
    door:  { x: 580, y: 288 },
    traps: [
      { type:'invis', x: 140, y: 280, w: 60, h: 20 },
      { type:'invis', x: 220, y: 240, w: 60, h: 20 },
      { type:'invis', x: 300, y: 280, w: 60, h: 20 },
      { type:'invis', x: 380, y: 240, w: 60, h: 20 },
      { type:'invis', x: 460, y: 280, w: 60, h: 20 }
    ]
  });
})();

/* ---------- STAGE 5 : MULTI-STAGE PSYCHOLOGICAL WARFARE ---------- */
(function(){
  const g = newGrid();
  fillR(g, 0, 16, 31, 17);
  LEVELS.push({
    name: 'REVERSE ORDER',
    grid: gridStr(g),
    spawn: { x: 40, y: 304 },
    door:  { x: 20, y: 288 },
    buttonOrder: [3, 2, 1],
    traps: [
      { type:'button', id:1, x: 120, y: 314, w: 26, h: 6 },
      { type:'button', id:2, x: 300, y: 314, w: 26, h: 6 },
      { type:'button', id:3, x: 480, y: 314, w: 26, h: 6 },
      { type:'fakedoor', x: 200, y: 288 },
      { type:'fakedoor', x: 400, y: 288 },
      { type:'jump', x: 560, baseY: 320, w: 20, h: 26, radius: 80 }
    ]
  });
})();

/* ---------- STAGE 6 : REVERSE GRAVITY ---------- */
(function(){
  const g = newGrid();
  fillR(g, 0, 0, 31, 1);                  // ceiling
  fillR(g, 18, 0, 20, 1, '.');            // ceiling gap A
  fillR(g, 25, 0, 26, 1, '.');            // ceiling gap B
  fillR(g, 0, 16, 12, 17);                // floor (left only)
  g[2][22] = 'v';
  g[2][23] = 'v';
  LEVELS.push({
    name: 'UPSIDE DOWN',
    grid: gridStr(g),
    spawn: { x: 40, y: 304 },
    door:  { x: 580, y: 40 },
    traps: [
      { type:'grav', x: 140, y: 240, w: 60, h: 80, dir: -1 }
    ]
  });
})();

/* ---------- STAGE 7 : INVERTED CONTROLS ---------- */
(function(){
  const g = newGrid();
  fillR(g, 0, 16, 31, 17);
  fillR(g, 10, 16, 12, 17, '.');
  fillR(g, 24, 16, 25, 17, '.');
  g[15][18] = '^';
  g[15][19] = '^';
  g[15][20] = '^';
  LEVELS.push({
    name: 'MIRROR BRAIN',
    grid: gridStr(g),
    spawn: { x: 560, y: 304 },
    door:  { x: 20, y: 288 },
    invertControls: true,
    traps: [
      { type:'jump', x: 460, baseY: 320, w: 20, h: 26, radius: 90 }
    ]
  });
})();

/* ---------- STAGE 8 : THE COLLAPSING BRIDGE ---------- */
(function(){
  const g = newGrid();
  fillR(g, 0, 16, 1, 17);
  fillR(g, 22, 16, 31, 17);
  LEVELS.push({
    name: 'COLLAPSING BRIDGE',
    grid: gridStr(g),
    spawn: { x: 20, y: 304 },
    door:  { x: 580, y: 288 },
    traps: [
      { type:'drop', x:  40, y: 320, w: 60, h: 40, delay: 0.55 },
      { type:'drop', x: 120, y: 320, w: 60, h: 40, delay: 0.55 },
      { type:'drop', x: 200, y: 320, w: 60, h: 40, delay: 0.55 },
      { type:'drop', x: 280, y: 320, w: 60, h: 40, delay: 0.55 },
      { type:'drop', x: 360, y: 320, w: 60, h: 40, delay: 0.55 }
    ]
  });
})();

/* ---------- STAGE 9 : THE FAKE BRIDGE ---------- */
(function(){
  const g = newGrid();
  fillR(g, 0, 16, 13, 17);                // left ground
  fillR(g, 21, 16, 31, 17);               // right ground
  fillR(g, 15, 13, 17, 13);               // the real platform
  LEVELS.push({
    name: 'THE FAKE BRIDGE',
    grid: gridStr(g),
    spawn: { x: 40, y: 304 },
    door:  { x: 580, y: 288 },
    traps: [
      { type:'fake', x: 280, y: 300, w: 140, h: 20 },   // lies
      { type:'jump', x: 500, baseY: 320, w: 20, h: 26, radius: 90 }
    ]
  });
})();

/* ---------- STAGE 10 : FINAL GAUNTLET ---------- */
(function(){
  const g = newGrid();
  fillR(g, 0, 16, 17, 17);
  fillR(g, 21, 16, 31, 17);
  fillR(g, 21, 13, 23, 13);               // A
  fillR(g, 25, 10, 27, 10);               // B
  fillR(g, 28,  7, 31,  7);               // C
  g[15][8] = '^';
  LEVELS.push({
    name: 'NO MORE TRUST',
    grid: gridStr(g),
    spawn: { x: 40, y: 304 },
    door:  { x: 580, y: 288 },
    doorFlees: { x: 580, y: 108 },
    traps: [
      { type:'crush', x: 240, w: 60, h: 160, upY: 80, downY: 160,
        triggerX: 180, once: false },
      { type:'drop', x: 360, y: 320, w: 60, h: 40, delay: 0.30 },
      { type:'jump', x: 500, baseY: 320, w: 20, h: 26, radius: 85 }
    ]
  });
})();

/* ============================================================
   GAME STATE
   ============================================================ */
let levelIndex = 0;
let deaths     = 0;
let level      = null;
let door       = null;
let gameState  = 'play';     // play | victory
let flash      = 0;
let shake      = 0;
let staticSolids = [];
let SOLIDS = [];

const player = {
  x:0, y:0, vx:0, vy:0,
  w:14, h:16,
  gdir:1,
  grounded:false,
  coyote:0
};

/* ============================================================
   LEVEL BUILD
   ============================================================ */
function buildLevel(){
  const L = LEVELS[levelIndex];

  staticSolids = [];
  const hazards = [];

  for (let r = 0; r < L.grid.length; r++){
    const row = L.grid[r];
    for (let c = 0; c < row.length; c++){
      const ch = row[c];
      if (ch === '#'){
        staticSolids.push({ x:c*T, y:r*T, w:T, h:T });
      } else if (ch === '^'){
        hazards.push({ x:c*T+3, y:r*T+7, w:T-6, h:13 });
      } else if (ch === 'v'){
        hazards.push({ x:c*T+3, y:r*T,   w:T-6, h:13 });
      }
    }
  }

  const traps = (L.traps || []).map(src => {
    const t = Object.assign({}, src);
    if (t.type === 'drop'){
      t.falling = false; t.triggered = false; t.timer = 0; t.vy = 0; t.gone = false;
    } else if (t.type === 'jump'){
      t.state = 'idle'; t.timer = 0; t.h01 = 0;
    } else if (t.type === 'invis'){
      t.revealed = false;
    } else if (t.type === 'crush'){
      t.phase = 'idle'; t.timer = 0; t.y = t.upY;
    } else if (t.type === 'button'){
      t.pressed = false;
    } else if (t.type === 'fakedoor'){
      t.gone = false; t.timer = 0;
    }
    return t;
  });

  level = {
    def: L,
    t: 0,
    hazards: hazards,
    traps: traps,
    invertControls: !!L.invertControls,
    doorOpen: !L.buttonOrder,
    seq: [],
    seqFail: 0
  };

  door = {
    x: L.door.x, y: L.door.y, w: 24, h: 32,
    state: 'idle',
    flee: L.doorFlees || null,
    sx:0, sy:0, tx:0, ty:0, ft:0
  };

  player.x = L.spawn.x;
  player.y = L.spawn.y;
  player.vx = 0;
  player.vy = 0;
  player.gdir = 1;
  player.grounded = false;
  player.coyote = 0;
  jumpBuffer = 0;

  flash = 0.18;
  shake = 0;
}

/* ============================================================
   DEATH / WIN
   ============================================================ */
function kill(){
  if (gameState !== 'play') return;
  deaths++;
  buildLevel();
  flash = 0.32;
  shake = 12;
}

function win(){
  if (gameState !== 'play') return;
  levelIndex++;
  if (levelIndex >= LEVELS.length){
    gameState = 'victory';
    return;
  }
  buildLevel();
  flash = 0.16;
}

/* ============================================================
   PHYSICS
   ============================================================ */
function buildSolids(){
  SOLIDS = staticSolids.slice();
  for (const t of level.traps){
    if (t.type === 'drop' && !t.gone) SOLIDS.push(t);
    else if (t.type === 'invis')      SOLIDS.push(t);
  }
  return SOLIDS;
}

function moveX(dx){
  player.x += dx;
  for (const s of SOLIDS){
    if (!overlap(player, s)) continue;
    if (dx > 0){ player.x = s.x - player.w; player.vx = 0; }
    else if (dx < 0){ player.x = s.x + s.w; player.vx = 0; }
  }
}

function moveY(dy){
  player.y += dy;
  for (const s of SOLIDS){
    if (!overlap(player, s)) continue;
    if (dy > 0){
      player.y = s.y - player.h;
      if (player.gdir > 0) player.grounded = true;
    } else if (dy < 0){
      player.y = s.y + s.h;
      if (player.gdir < 0) player.grounded = true;
    }
    player.vy = 0;
  }
}

/* ============================================================
   TRAPS
   ============================================================ */
function pressButton(id){
  if (level.doorOpen) return;
  const seq = level.seq;
  if (seq.length && seq[seq.length - 1] === id) return;

  seq.push(id);
  const target = level.def.buttonOrder;

  for (let i = 0; i < seq.length; i++){
    if (seq[i] !== target[i]){
      level.seq = [];
      level.seqFail = 0.45;
      return;
    }
  }
  if (seq.length === target.length){
    level.doorOpen = true;
  }
}

function updateTraps(dt){
  if (level.seqFail > 0) level.seqFail -= dt;

  for (const t of level.traps){
    switch (t.type){

      /* ---- DROP FLOOR ---- */
      case 'drop': {
        if (t.gone) break;
        if (!t.triggered && overlap(player, t)){ t.triggered = true; t.timer = 0; }
        if (t.triggered && !t.falling){
          t.timer += dt;
          if (t.timer >= (t.delay !== undefined ? t.delay : 0.35)) t.falling = true;
        }
        if (t.falling){
          t.vy = Math.min(t.vy + GRAV * 1.4, 16);
          t.y += t.vy;
          if (t.y > H + 120) t.gone = true;
        }
        break;
      }

      /* ---- JUMPING SPIKE ---- */
      case 'jump': {
        const pcx = player.x + player.w/2;
        const pcy = player.y + player.h/2;
        const cx  = t.x + t.w/2;
        const cy  = t.baseY - 12;
        const d   = Math.hypot(pcx - cx, pcy - cy);
        const R   = t.radius || 90;

        if (t.state === 'idle'){
          t.h01 = 0;
          if (d < R){ t.state = 'up'; t.timer = 0; }
        } else if (t.state === 'up'){
          t.timer += dt;
          t.h01 = Math.min(1, t.timer / 0.12);
          if (t.timer > 0.12 + 0.75){ t.state = 'down'; t.timer = 0; }
        } else if (t.state === 'down'){
          t.timer += dt;
          t.h01 = Math.max(0, 1 - t.timer / 0.22);
          if (t.timer > 0.22){ t.state = 'cool'; t.timer = 0; }
        } else {
          t.timer += dt;
          t.h01 = 0;
          if (t.timer > 1.2 && d > R * 1.35) t.state = 'idle';
        }
        break;
      }

      /* ---- INVISIBLE PLATFORM ---- */
      case 'invis': {
        if (!t.revealed){
          const pcx = player.x + player.w/2;
          const pcy = player.y + player.h/2;
          const cx  = t.x + t.w/2;
          const cy  = t.y + t.h/2;
          if (Math.hypot(pcx - cx, pcy - cy) < 115) t.revealed = true;
        }
        break;
      }

      /* ---- CRUSHER ---- */
      case 'crush': {
        if (t.phase === 'idle'){
          if (t.triggerX === undefined || player.x > t.triggerX){
            t.phase = t.once ? 'slam' : 'wait';
            t.timer = 0;
          }
        } else if (t.phase === 'wait'){
          t.timer += dt;
          if (t.timer > 1.8){ t.phase = 'slam'; t.timer = 0; }
        } else if (t.phase === 'slam'){
          t.timer += dt;
          const p = Math.min(1, t.timer / 0.10);
          t.y = t.upY + (t.downY - t.upY) * (p * p);
          if (p >= 1){ t.phase = 'down'; t.timer = 0; }
        } else if (t.phase === 'down'){
          t.timer += dt;
          if (!t.once && t.timer > 0.9){ t.phase = 'rise'; t.timer = 0; }
        } else if (t.phase === 'rise'){
          t.timer += dt;
          const p = Math.min(1, t.timer / 0.7);
          t.y = t.downY + (t.upY - t.downY) * p;
          if (p >= 1){ t.phase = 'wait'; t.timer = 0; }
        }
        break;
      }

      /* ---- GRAVITY FLIP ZONE ---- */
      case 'grav': {
        if (overlap(player, t)){
          if (player.gdir !== t.dir){
            player.gdir = t.dir;
            player.vy = 0;
            player.grounded = false;
          }
        }
        break;
      }

      /* ---- BUTTON ---- */
      case 'button': {
        const on = overlap(player, t);
        if (on && !t.pressed){
          t.pressed = true;
          pressButton(t.id);
        } else if (!on){
          t.pressed = false;
        }
        break;
      }

      /* ---- FAKE DOOR ---- */
      case 'fakedoor': {
        if (!t.gone && overlap(player, { x:t.x, y:t.y, w:24, h:32 })){
          t.gone = true;
          t.timer = 0;
        }
        if (t.gone) t.timer += dt;
        break;
      }
    }
  }
}

/* ============================================================
   HAZARDS + DOOR CHECKS
   ============================================================ */
function checkHazards(){
  for (const h of level.hazards){
    if (overlap(player, h)) return kill();
  }
  for (const t of level.traps){
    if (t.type === 'crush'){
      if (overlap(player, t)) return kill();
    } else if (t.type === 'jump' && t.h01 > 0.15){
      const hh = t.h * t.h01;
      if (overlap(player, { x:t.x, y:t.baseY - hh, w:t.w, h:hh })) return kill();
    }
  }
}

function checkDoor(){
  if (!level.doorOpen) return;
  if (door.state === 'fleeing') return;
  if (!overlap(player, door)) return;

  if (door.state === 'idle' && door.flee){
    door.state = 'fleeing';
    door.ft = 0;
    door.sx = door.x;  door.sy = door.y;
    door.tx = door.flee.x;
    door.ty = door.flee.y;
    return;
  }
  win();
}

/* ============================================================
   MAIN UPDATE (fixed 60Hz step)
   ============================================================ */
function update(){
  const dt = STEP;
  level.t += dt;

  if (flash > 0) flash -= dt;
  if (shake > 0)  shake *= 0.86;
  if (shake < 0.6) shake = 0;

  /* --- door flight animation --- */
  if (door.state === 'fleeing'){
    door.ft += dt;
    const p = Math.min(1, door.ft / 1.05);
    const e = 1 - Math.pow(1 - p, 3);
    door.x = door.sx + (door.tx - door.sx) * e;
    door.y = door.sy + (door.ty - door.sy) * e - Math.sin(p * Math.PI) * 46;
    if (p >= 1) door.state = 'home';
  }

  /* --- traps --- */
  updateTraps(dt);

  /* --- build collision list --- */
  buildSolids();

  /* --- horizontal input --- */
  let dir = 0;
  if (keys['ArrowLeft']  || keys['KeyA']) dir -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) dir += 1;
  if (level.invertControls) dir = -dir;

  if (dir !== 0) player.vx += dir * ACCEL;
  else           player.vx *= FRIC;
  player.vx = clamp(player.vx, -SPEED, SPEED);
  if (Math.abs(player.vx) < 0.06) player.vx = 0;

  /* --- gravity --- */
  player.vy += GRAV * player.gdir;
  if (player.gdir > 0) player.vy = Math.min(player.vy, MAXFALL);
  else                 player.vy = Math.max(player.vy, -MAXFALL);

  /* --- jump --- */
  if (jumpBuffer > 0) jumpBuffer--;
  if (player.coyote > 0) player.coyote--;

  if (jumpBuffer > 0 && (player.grounded || player.coyote > 0)){
    player.vy = -JUMP * player.gdir;
    player.grounded = false;
    player.coyote = 0;
    jumpBuffer = 0;
  }

  /* variable jump cut-off */
  const held = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];
  if (!held && player.vy * player.gdir < -3) player.vy *= 0.55;

  /* --- integrate --- */
  player.grounded = false;
  moveX(player.vx);
  moveY(player.vy);
  if (player.grounded) player.coyote = 6;

  player.x = clamp(player.x, 0, W - player.w);

  /* --- lethal checks --- */
  if (player.y > H + 70 || player.y < -150){
    kill();
    return;
  }

  checkHazards();
  checkDoor();
}

/* ============================================================
   RENDER
   ============================================================ */
function drawBlock(s, color){
  ctx.fillStyle = color || '#c0c0c0';
  ctx.fillRect(s.x, s.y, s.w, s.h);
  ctx.fillStyle = 'rgba(0,0,0,0.20)';
  ctx.fillRect(s.x, s.y + s.h - 3, s.w, 3);
  ctx.strokeStyle = '#2b2b2b';
  ctx.lineWidth = 2;
  ctx.strokeRect(s.x + 1, s.y + 1, s.w - 2, s.h - 2);
}

function drawSpike(x, y, w, h, dir){
  ctx.fillStyle = '#ff2a2a';
  const n = Math.max(1, Math.round(w / 6));
  const step = w / n;
  for (let i = 0; i < n; i++){
    const bx = x + i * step;
    ctx.beginPath();
    if (dir > 0){
      ctx.moveTo(bx, y + h);
      ctx.lineTo(bx + step/2, y);
      ctx.lineTo(bx + step, y + h);
    } else {
      ctx.moveTo(bx, y);
      ctx.lineTo(bx + step/2, y + h);
      ctx.lineTo(bx + step, y);
    }
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,120,120,0.55)';
  ctx.fillRect(x, dir > 0 ? y + h - 2 : y, w, 2);
}

function drawPlayer(){
  const p = player;
  ctx.save();
  if (p.gdir < 0){
    ctx.translate(p.x + p.w/2, p.y + p.h/2);
    ctx.scale(1, -1);
    ctx.translate(-(p.x + p.w/2), -(p.y + p.h/2));
  }
  // body
  ctx.fillStyle = '#22cce8';
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.fillStyle = '#8ff2ff';
  ctx.fillRect(p.x, p.y, p.w, 3);
  ctx.fillStyle = '#0a6a80';
  ctx.fillRect(p.x, p.y + p.h - 3, p.w, 3);
  // eyes
  ctx.fillStyle = '#08161c';
  ctx.fillRect(p.x + 3, p.y + 5, 3, 4);
  ctx.fillRect(p.x + p.w - 6, p.y + 5, 3, 4);
  // highlight
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillRect(p.x + 3, p.y + 5, 1, 1);
  ctx.fillRect(p.x + p.w - 6, p.y + 5, 1, 1);
  ctx.restore();
}

function drawDoorBody(d, wings){
  const pulse = 0.5 + 0.5 * Math.sin(level.t * 6);

  if (wings){
    ctx.fillStyle = '#e8e8f0';
    const flap = Math.sin(level.t * 22) * 6;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y + 8);
    ctx.lineTo(d.x - 14, d.y + 2 + flap);
    ctx.lineTo(d.x - 10, d.y + 18);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(d.x + d.w, d.y + 8);
    ctx.lineTo(d.x + d.w + 14, d.y + 2 - flap);
    ctx.lineTo(d.x + d.w + 10, d.y + 18);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle = '#7a4a22';
  ctx.fillRect(d.x, d.y, d.w, d.h);
  ctx.fillStyle = '#5a3418';
  ctx.fillRect(d.x + 2, d.y + 2, d.w - 4, d.h - 4);
  ctx.fillStyle = '#8f5c2c';
  ctx.fillRect(d.x + 4, d.y + 4, d.w - 8, 10);

  ctx.fillStyle = `rgba(0,255,102,${0.45 + 0.45 * pulse})`;
  ctx.fillRect(d.x + d.w - 7, d.y + d.h/2 - 2, 3, 4);

  ctx.strokeStyle = `rgba(0,255,102,${0.25 + 0.30 * pulse})`;
  ctx.lineWidth = 2;
  ctx.strokeRect(d.x - 2, d.y - 2, d.w + 4, d.h + 4);
}

function render(){
  ctx.save();
  if (shake > 0){
    ctx.translate(
      (Math.random() - 0.5) * shake,
      (Math.random() - 0.5) * shake
    );
  }

  /* background */
  ctx.fillStyle = '#121216';
  ctx.fillRect(-30, -30, W + 60, H + 60);

  /* faint grid texture */
  ctx.fillStyle = 'rgba(255,255,255,0.018)';
  for (let y = 0; y < H; y += 40)
    for (let x = 0; x < W; x += 40)
      ctx.fillRect(x, y, 1, 1);

  /* static terrain */
  for (const s of staticSolids) drawBlock(s);

  /* traps */
  for (const t of level.traps){

    if (t.type === 'drop'){
      if (t.gone) continue;
      drawBlock(t, t.falling ? '#9a9a9a' : '#c0c0c0');
    }

    else if (t.type === 'invis'){
      ctx.globalAlpha = t.revealed ? 1 : 0.07;
      drawBlock(t, '#c0c0c0');
      ctx.globalAlpha = 1;
    }

    else if (t.type === 'fake'){
      drawBlock(t, '#c0c0c0');
      // tell-tale 1px shimmer — the only hint
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.fillRect(t.x, t.y + 2, t.w, 1);
    }

    else if (t.type === 'jump'){
      // little nub when hidden
      if (t.h01 <= 0.02){
        ctx.fillStyle = '#5a2020';
        ctx.fillRect(t.x + 4, t.baseY - 3, t.w - 8, 3);
      } else {
        const hh = t.h * t.h01;
        drawSpike(t.x, t.baseY - hh, t.w, hh, 1);
      }
    }

    else if (t.type === 'crush'){
      if (t.y > -100){
        ctx.fillStyle = '#8a1f1f';
        ctx.fillRect(t.x, t.y, t.w, t.h);
        ctx.fillStyle = '#ff2a2a';
        for (let i = 0; i < t.h; i += 20){
          ctx.fillRect(t.x + 4, t.y + i + 4, t.w - 8, 4);
        }
        ctx.strokeStyle = '#2b2b2b';
        ctx.lineWidth = 2;
        ctx.strokeRect(t.x + 1, t.y + 1, t.w - 2, t.h - 2);
      }
    }

    else if (t.type === 'button'){
      const lit = t.pressed;
      ctx.fillStyle = lit ? '#00ff66' : '#3a5a44';
      ctx.fillRect(t.x, t.y, t.w, t.h);
      ctx.strokeStyle = '#2b2b2b';
      ctx.lineWidth = 2;
      ctx.strokeRect(t.x, t.y, t.w, t.h);

      // id pips
      ctx.fillStyle = lit ? '#08160c' : '#8a9a90';
      for (let i = 0; i < t.id; i++){
        ctx.fillRect(t.x + 4 + i * 6, t.y + 2, 3, 2);
      }
    }

    else if (t.type === 'fakedoor'){
      if (t.gone){
        if (t.timer < 0.5){
          const a = 1 - t.timer / 0.5;
          ctx.globalAlpha = a;
          ctx.fillStyle = '#00ff66';
          ctx.fillRect(t.x - 10 * (1-a), t.y - 10 * (1-a), 24 + 20*(1-a), 32 + 20*(1-a));
          ctx.globalAlpha = 1;
        }
        continue;
      }
      ctx.globalAlpha = 0.9;
      drawDoorBody({ x:t.x, y:t.y, w:24, h:32 }, false);
      ctx.globalAlpha = 1;
    }

    else if (t.type === 'grav'){
      // completely invisible — that is the point
      ctx.fillStyle = 'rgba(120,60,255,0.05)';
      ctx.fillRect(t.x, t.y, t.w, t.h);
    }
  }

  /* static grid hazards */
  for (const h of level.hazards){
    drawSpike(h.x, h.y, h.w, h.h, 1);
  }

  /* door */
  if (level.doorOpen) drawDoorBody(door, door.state === 'fleeing');

  /* player */
  drawPlayer();

  ctx.restore();

  /* ---------- HUD ---------- */
  ctx.textBaseline = 'top';
  ctx.font = 'bold 11px "Courier New", monospace';

  ctx.fillStyle = '#c0c0c0';
  ctx.fillText('STAGE ' + String(levelIndex + 1).padStart(2, '0'), 12, 10);

  ctx.fillStyle = '#ff2a2a';
  ctx.fillText('DEATHS: ' + deaths, 12, 25);

  ctx.fillStyle = '#3f3f4a';
  ctx.textAlign = 'right';
  ctx.fillText('R = RETRY', W - 12, 10);
  ctx.textAlign = 'left';

  /* level name intro */
  if (level.t < 2.2){
    const a = level.t < 1.6 ? 1 : (2.2 - level.t) / 0.6;
    ctx.globalAlpha = Math.max(0, a);
    ctx.textAlign = 'center';
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.fillStyle = '#e8e8f0';
    ctx.fillText(LEVELS[levelIndex].name, W/2, 60);
    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.fillStyle = '#4a4a55';
    ctx.fillText('STAGE ' + String(levelIndex + 1).padStart(2,'0'), W/2, 84);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  /* sequence-fail flash for stage 5 */
  if (level.seqFail > 0){
    ctx.fillStyle = `rgba(255,42,42,${level.seqFail * 0.5})`;
    ctx.fillRect(0, 0, W, H);
  }

  /* damage flash */
  if (flash > 0){
    ctx.fillStyle = `rgba(255,42,42,${Math.min(0.55, flash)})`;
    ctx.fillRect(0, 0, W, H);
  }

  /* victory */
  if (gameState === 'victory'){
    ctx.fillStyle = 'rgba(8,8,10,0.88)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 26px "Courier New", monospace';
    ctx.fillStyle = '#00ff66';
    ctx.fillText('YOU BEAT THE TROLL', W/2, 130);
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillStyle = '#c0c0c0';
    ctx.fillText('TOTAL DEATHS: ' + deaths, W/2, 172);
    ctx.fillStyle = '#4a4a55';
    ctx.fillText('PRESS R TO DO IT ALL AGAIN', W/2, 210);
    ctx.textAlign = 'left';
  }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let acc = 0;
let last = performance.now();

function loop(now){
  requestAnimationFrame(loop);

  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;

  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 8){
    if (gameState === 'play') update();
    acc -= STEP;
  }

  render();
}

/* ============================================================
   BOOT
   ============================================================ */
buildLevel();
requestAnimationFrame(loop);

</script>
</body>
