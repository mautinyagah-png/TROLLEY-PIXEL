const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 640, H = 360, T = 20;

function fit(){
  const s = Math.max(1, Math.min(
    Math.floor(window.innerWidth  / W),
    Math.floor(window.innerHeight / H)
  ));
  cv.style.width  = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fit);
fit();

/* ============================================================
   TUNING
   ============================================================ */
const GRAV     = 0.60;

const STEP     = 1 / 60;

/* ============================================================
   AUDIO  —  Web Audio API, zero external files
   ============================================================ */
const Sfx = (() => {
  let actx = null;
  let muted = false;

  function ctxInit(){
    if (!actx){
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }

  function blip(type, f0, f1, dur, vol, delay){
    const a = ctxInit();
    if (!a || muted) return;
    const t0 = a.currentTime + (delay || 0);
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(20, f0), t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }

  function noise(dur, vol){
    const a = ctxInit();
    if (!a || muted) return;
    const len = Math.max(1, Math.floor(a.sampleRate * dur));
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++){
      d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    }
    const src = a.createBufferSource();
    src.buffer = buf;
    const g = a.createGain();
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    src.connect(g); g.connect(a.destination);
    src.start();
  }

  return {
    unlock(){ ctxInit(); },
    jump(){ blip('square', 250, 600, 0.09, 0.10); },
    dblJump(){ blip('square', 420, 950, 0.11, 0.11); },
    death(){ blip('sawtooth', 340, 50, 0.34, 0.13); noise(0.20, 0.09); },
    win(){
      blip('triangle', 523, 523, 0.10, 0.12, 0.00);
      blip('triangle', 659, 659, 0.10, 0.12, 0.09);
      blip('triangle', 784, 784, 0.10, 0.12, 0.18);
      blip('triangle', 1047, 1047, 0.24, 0.13, 0.27);
    },
    click(){ blip('square', 880, 460, 0.045, 0.06); },
    thud(){ blip('triangle', 130, 38, 0.16, 0.14); noise(0.08, 0.05); },
    whoosh(){ blip('sine', 700, 180, 0.34, 0.09); },
    ui(){ blip('square', 720, 980, 0.05, 0.05); },
    bait(){ blip('sawtooth', 800, 60, 0.42, 0.15); noise(0.30, 0.10); },
    toggleMute(){ muted = !muted; return muted; },
    isMuted(){ return muted; }
  };
})();

/* ============================================================
   INPUT
   ============================================================ */
const keys = Object.create(null);
let jumpBuffer = 0;
const mouse = { x: -1, y: -1 };

window.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  Sfx.unlock();

  if (!keys[e.code]) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') jumpBuffer = 7;
    if (e.code === 'KeyM') Sfx.toggleMute();

    if (e.code === 'KeyR') {
      if (gameState === 'victory') restartRun();
      else if (gameState === 'play') kill();
    }

    if (e.code === 'Escape' || e.code === 'KeyL') {
      if (gameState === 'select'){
        gameState = 'play';
        Sfx.ui();
      } else if (gameState === 'play' || gameState === 'victory'){
        if (e.shiftKey) unlocked = LEVELS.length;
        gameState = 'select';
        Sfx.ui();
      }
    }

    if (gameState === 'select'){
      let picked = -1;
      if (e.code.startsWith('Digit')){
        const d = parseInt(e.code.slice(5), 10);
        picked = (d === 0) ? 9 : d - 1;
      } else if (e.code.startsWith('Numpad')){
        const d = parseInt(e.code.slice(6), 10);
        picked = (d === 0) ? 9 : d - 1;
      }
      if (picked >= 0 && picked < unlocked) startLevel(picked);
    }
  }
  keys[e.code] = true;
}, { passive:false });

window.addEventListener('keyup', e => { keys[e.code] = false; });

function mousePos(e){
  const r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (W / r.width),
    y: (e.clientY - r.top)  * (H / r.height)
  };
}
cv.addEventListener('mousemove', e => {
  const p = mousePos(e);
  mouse.x = p.x; mouse.y = p.y;
});
cv.addEventListener('mousedown', e => {
  Sfx.unlock();
  if (gameState !== 'select') return;
  const p = mousePos(e);
  for (let i = 0; i < LEVELS.length; i++){
    const r = lsRect(i);
    if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h){
      if (i < unlocked) startLevel(i);
      return;
    }
  }
});

/* ============================================================
   UTIL
   ============================================================ */
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const overlap = (a,b) =>
  a.x < b.x + b.w && a.x + a.w > b.x &&
  a.y < b.y + b.h && a.y + a.h > b.y;

/* ============================================================
   LEVEL GRID HELPERS
   ============================================================ */
function newGrid(){
  const g = [];
  for (let r = 0; r < 18; r++) g.push(new Array(32).fill('.'));
  return g;
}
function fillR(g, c0, r0, c1, r1, ch){
  ch = ch || '#';
  for (let r = r0; r <= r1; r++)
    for (let c = c0; c <= c1; c++)
      if (g[r] && c >= 0 && c < 32) g[r][c] = ch;
}
function gridStr(g){ return g.map(r => r.join('')); }

/* ============================================================
   GAME STATE
   ============================================================ */
let levelIndex = 0;
let deaths     = 0;
let sessionTime = 0;
let unlocked   = 1;
let gameState  = 'play';
let flash      = 0;
let flashCol   = '#ff2a2a';
let shake      = 0;
let glitch     = 0;
let level      = null;
let door       = null;
let staticSolids = [];
let SOLIDS = [];

let lastLevelIndex = -1;
let doorBaited = false;

const graveStore = {};
const particles  = [];

/* ---- NIGHTMARE / UI WARFARE STATE ---- */
const nightmare = {

};
const ui = {

};

};

function gravesFor(i){
  if (!graveStore[i]) graveStore[i] = [];
  return graveStore[i];
}

/* ============================================================
   PARTICLES
   ============================================================ */
function spawnGibs(x, y, n){
  for (let i = 0; i < n; i++){
    if (particles.length >= MAX_PARTICLES) break;
    const ang = Math.random() * Math.PI * 2;
    const spd = 1.4 + Math.random() * 4.6;
    particles.push({
      x: x, y: y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 2.2,
      life: 0.55 + Math.random() * 0.65,
      maxLife: 1.2,
      size: Math.random() < 0.35 ? 4 : 2,
      color: Math.random() < 0.28 ? '#8ff2ff' : '#22cce8'
    });
  }
}

function spawnBurst(x, y, n){
  for (let i = 0; i < n; i++){
    if (particles.length >= MAX_PARTICLES) break;
    const ang = -Math.PI/2 + (Math.random() - 0.5) * 2.4;
    const spd = 1.0 + Math.random() * 2.4;
    particles.push({
      x: x, y: y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 0.28 + Math.random() * 0.22,
      maxLife: 0.5,
      size: 2,
      color: '#a9f4ff'
    });
  }
}

function spawnDust(x, y, n, col){
  for (let i = 0; i < n; i++){
    if (particles.length >= MAX_PARTICLES) break;
    const ang = Math.random() * Math.PI * 2;
    const spd = 0.8 + Math.random() * 2.2;
    particles.push({
      x: x + (Math.random()-0.5)*10,
      y: y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 1.0,
      life: 0.3 + Math.random() * 0.3,
      maxLife: 0.6,
      size: 2,
      color: col || '#8a8a96'
    });
  }
}

function updateParticles(){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.vy += 0.42;
    p.x  += p.vx;
    p.y  += p.vy;
    p.life -= STEP;

    const box = { x:p.x, y:p.y, w:p.size, h:p.size };
    for (let s = 0; s < SOLIDS.length; s++){
      const so = SOLIDS[s];
      if (!overlap(box, so)) continue;
      if (p.vy > 0){
        p.y = so.y - p.size;
        p.vy *= -0.45;
        p.vx *= 0.82;
      } else if (p.vy < 0){
        p.y = so.y + so.h;
        p.vy *= -0.40;
      }
      break;
    }
    if (p.y > H - 2){ p.y = H - 2; p.vy *= -0.40; p.vx *= 0.85; }

    if (p.life <= 0) particles.splice(i, 1);
  }
}

/* ============================================================
   LEVEL BUILD
   ============================================================ */
function buildLevel(){
  const L = LEVELS[levelIndex];

  /* reset door-bait only when the stage actually changes */
  if (lastLevelIndex !== levelIndex){
    lastLevelIndex = levelIndex;
    doorBaited = false;
  }

  staticSolids = [];
  const hazards = [];

  for (let r = 0; r < L.grid.length; r++){
    const row = L.grid[r];
    for (let c = 0; c < row.length; c++){
      const ch = row[c];
      if (ch === '#'){
        staticSolids.push({ x:c*T, y:r*T, w:T, h:T });
      } else if (ch === '^'){
        hazards.push({ x:c*T+3, y:r*T+7, w:T-6, h:13 });
      } else if (ch === 'v'){
        hazards.push({ x:c*T+3, y:r*T,   w:T-6, h:13 });
      }
    }
  }

  const traps = (L.traps || []).map(src => {
    const t = Object.assign({}, src);
    if (t.type === 'drop'){
      t.falling = false; t.triggered = false; t.timer = 0; t.vy = 0; t.gone = false;
    } else if (t.type === 'jump'){
      t.state = 'idle'; t.timer = 0; t.h01 = 0;
    } else if (t.type === 'invis'){
      t.revealed = false;
    } else if (t.type === 'crush'){
      t.phase = 'idle'; t.timer = 0; t.y = t.upY;
    } else if (t.type === 'button'){
      t.pressed = false;
    } else if (t.type === 'fakedoor'){
      t.gone = false; t.timer = 0;
    } else if (t.type === 'ambush'){
      t.triggered = false; t.timer = 0; t.h01 = 0;
    } else if (t.type === 'crumble'){
      t.stepped = false; t.collapsed = false; t.timer = 0; t.vy = 0; t.gone = false;
    }
    return t;
  });

  level = {
    def: L,
    t: 0,
    hazards: hazards,
    traps: traps,
    invertControls: !!L.invertControls,
    doorOpen: !L.buttonOrder,
    seq: [],
    seqFail: 0
  };

  door = {
    x: L.door.x, y: L.door.y, w: 24, h: 32,
    state: 'idle',
    flee: L.doorFlees || null,
    sx:0, sy:0, tx:0, ty:0, ft:0
  };

  player.x = L.spawn.x;
  player.y = L.spawn.y;
  player.vx = 0;
  player.vy = 0;
  player.gdir = 1;
  player.grounded = false;
  player.coyote = 0;
  player.jumpsLeft = 2;
  jumpBuffer = 0;

  /* reset nightmares */
  nightmare.tempInvert = 0;
  nightmare.tickTimer  = 6 + Math.random() * 6;
  nightmare.baitFlash  = 0;
  ui.bannerTimer       = 0;
  ui.fakeDeathTimer    = 0;
}

/* ============================================================
   DEATH / WIN / START
   ============================================================ */
function kill(){
  if (gameState !== 'play') return;

  deaths++;

  const cx = player.x + player.w/2;
  const cy = player.y + player.h/2;

  spawnGibs(cx, cy, 16);

  const gr = gravesFor(levelIndex);
  gr.push({ x: cx, y: Math.min(player.y + player.h, H - 6) });
  if (gr.length > 120) gr.shift();

  Sfx.death();

  ui.bannerTimer    = 0;
  ui.fakeDeathTimer = 0;

  buildLevel();

  flash = 0.30;
  flashCol = '#ff2a2a';
  shake = 16;
  glitch = 0.20;
}

function win(){
  if (gameState !== 'play') return;

  ui.bannerTimer    = 0;
  ui.fakeDeathTimer = 0;

  Sfx.win();
  spawnGibs(door.x + door.w/2, door.y + door.h/2, 18);

  unlocked = Math.max(unlocked, levelIndex + 2);

  levelIndex++;
  if (levelIndex >= LEVELS.length){
    gameState = 'victory';
    return;
  }
  buildLevel();
  flash = 0.14;
  flashCol = '#00ff66';
  shake = 4;
}

function startLevel(i){
  levelIndex = i;
  gameState = 'play';
  particles.length = 0;
  buildLevel();
  Sfx.ui();
}

function restartRun(){
  deaths = 0;
  sessionTime = 0;
  levelIndex = 0;
  lastLevelIndex = -1;
  doorBaited = false;
  for (const k in graveStore) delete graveStore[k];
  particles.length = 0;
  gameState = 'play';
  buildLevel();
  Sfx.ui();
}

/* ============================================================
   BAIT DOOR
   ============================================================ */
function triggerBaitDoor(){
  /* teleport player home */
  player.x = level.def.spawn.x;
  player.y = level.def.spawn.y;
  player.vx = 0;
  player.vy = 0;
  player.gdir = 1;
  player.grounded = false;
  player.jumpsLeft = 2;

  /* fake-out audio + visual */
  Sfx.bait();
  Sfx.win();
  flash = 0.55;
  flashCol = '#00ff66';
  shake = 26;
  glitch = 0.55;
  nightmare.baitFlash = 0.9;

  showBanner('LEVEL CLEARED', 1.5);
  showFakeDeaths(deaths + 42 + Math.floor(Math.random() * 88), 1.0);

  /* spawn ambush hazards along the return path */
  const ambush1 = {
    type:'ambush', x: 180, baseY: 320, w: 20, h: 32,
    triggerX: 200, triggered:false, timer:0, h01:0
  };
  const ambush2 = {
    type:'ambush', x: 360, baseY: 320, w: 20, h: 32,
    triggerX: 380, triggered:false, timer:0, h01:0
  };
  level.traps.push(ambush1);
  level.traps.push(ambush2);
}

/* ============================================================
   PHYSICS
   ============================================================ */
function buildSolids(){
  SOLIDS = staticSolids.slice();
  for (const t of level.traps){
    if (t.type === 'drop' && !t.gone) SOLIDS.push(t);
    else if (t.type === 'invis')      SOLIDS.push(t);
    else if (t.type === 'crumble' && !t.collapsed) SOLIDS.push(t);
  }
  return SOLIDS;
}

function moveX(dx){
  player.x += dx;
  for (const s of SOLIDS){
    if (!overlap(player, s)) continue;
    if (dx > 0){ player.x = s.x - player.w; player.vx = 0; }
    else if (dx < 0){ player.x = s.x + s.w; player.vx = 0; }
  }
}

function moveY(dy){
  player.y += dy;
  for (const s of SOLIDS){
    if (!overlap(player, s)) continue;
    if (dy > 0){
      player.y = s.y - player.h;
      if (player.gdir > 0) player.grounded = true;
    } else if (dy < 0){
      player.y = s.y + s.h;
      if (player.gdir < 0) player.grounded = true;
    }
    player.vy = 0;
  }
}

/* ============================================================
   DOUBLE JUMP
   ============================================================ */
function doJump(isAir){
  player.vy = -JUMP * player.gdir * (isAir ? 0.90 : 1.0);
  player.grounded = false;
  player.coyote = 0;
  player.jumpsLeft = isAir ? 0 : 1;
  jumpBuffer = 0;

  if (isAir){
    Sfx.dblJump();
    const fy = player.gdir > 0 ? player.y + player.h : player.y;
    spawnBurst(player.x + player.w/2, fy, 8);
  } else {
    Sfx.jump();
  }
}

/* ============================================================
   TRAPS
   ============================================================ */
function pressButton(id){
  if (level.doorOpen) return;
  const seq = level.seq;
  if (seq.length && seq[seq.length - 1] === id) return;

  seq.push(id);
  const target = level.def.buttonOrder;

  for (let i = 0; i < seq.length; i++){
    if (seq[i] !== target[i]){
      level.seq = [];
      level.seqFail = 0.45;
      return;
    }
  }
  if (seq.length === target.length){
    level.doorOpen = true;
    Sfx.win();
  }
}

function updateTraps(dt){
  if (level.seqFail > 0) level.seqFail -= dt;

  for (const t of level.traps){
    switch (t.type){

      /* ---- DROP FLOOR ---- */
      case 'drop': {
        if (t.gone) break;
        if (!t.triggered && overlap(player, t)){ t.triggered = true; t.timer = 0; }
        if (t.triggered && !t.falling){
          t.timer += dt;
          if (t.timer >= (t.delay !== undefined ? t.delay : 0.35)){
            t.falling = true;
            Sfx.click();
          }
        }
        if (t.falling){
          t.vy = Math.min(t.vy + GRAV * 1.4, 16);
          t.y += t.vy;
          if (t.y > H + 120) t.gone = true;
        }
        break;
      }

      /* ---- JUMPING SPIKE ---- */
      case 'jump': {
        const pcx = player.x + player.w/2;
        const pcy = player.y + player.h/2;
        const cx  = t.x + t.w/2;
        const cy  = t.baseY - 12;
        const d   = Math.hypot(pcx - cx, pcy - cy);
        const R   = t.radius || 90;

        if (t.state === 'idle'){
          t.h01 = 0;
          if (d < R){ t.state = 'up'; t.timer = 0; Sfx.click(); }
        } else if (t.state === 'up'){
          t.timer += dt;
          t.h01 = Math.min(1, t.timer / 0.12);
          if (t.timer > 0.12 + 0.75){ t.state = 'down'; t.timer = 0; }
        } else if (t.state === 'down'){
          t.timer += dt;
          t.h01 = Math.max(0, 1 - t.timer / 0.22);
          if (t.timer > 0.22){ t.state = 'cool'; t.timer = 0; }
        } else {
          t.timer += dt;
          t.h01 = 0;
          if (t.timer > 1.2 && d > R * 1.35) t.state = 'idle';
        }
        break;
      }

      /* ---- INVISIBLE PLATFORM ---- */
      case 'invis': {
        if (!t.revealed){
          const pcx = player.x + player.w/2;
          const pcy = player.y + player.h/2;
          const cx  = t.x + t.w/2;
          const cy  = t.y + t.h/2;
          if (Math.hypot(pcx - cx, pcy - cy) < 115){
            t.revealed = true;
            spawnDust(cx, cy, 5, '#c0c0c0');
          }
        }
        break;
      }

      /* ---- CRUSHER ---- */
      case 'crush': {
        if (t.phase === 'idle'){
          if (t.triggerX === undefined || player.x > t.triggerX){
            t.phase = t.once ? 'slam' : 'wait';
            t.timer = 0;
          }
        } else if (t.phase === 'wait'){
          t.timer += dt;
          if (t.timer > 1.8){ t.phase = 'slam'; t.timer = 0; }
        } else if (t.phase === 'slam'){
          if (t.timer === 0){
            Sfx.thud();
            shake = Math.max(shake, 9);
            spawnDust(t.x + t.w/2, t.downY + t.h, 8, '#7a3a3a');
          }
          t.timer += dt;
          const p = Math.min(1, t.timer / 0.10);
          t.y = t.upY + (t.downY - t.upY) * (p * p);
          if (p >= 1){ t.phase = 'down'; t.timer = 0; }
        } else if (t.phase === 'down'){
          t.timer += dt;
          if (!t.once && t.timer > 0.9){ t.phase = 'rise'; t.timer = 0; }
        } else if (t.phase === 'rise'){
          t.timer += dt;
          const p = Math.min(1, t.timer / 0.7);
          t.y = t.downY + (t.upY - t.downY) * p;
          if (p >= 1){ t.phase = 'wait'; t.timer = 0; }
        }
        break;
      }

      /* ---- GRAVITY FLIP ---- */
      case 'grav': {
        if (overlap(player, t)){
          if (player.gdir !== t.dir){
            player.gdir = t.dir;
            player.vy = 0;
            player.grounded = false;
            Sfx.whoosh();
            spawnBurst(player.x + player.w/2, player.y + player.h/2, 6);
          }
        }
        break;
      }

      /* ---- BUTTON ---- */
      case 'button': {
        const on = overlap(player, t);
        if (on && !t.pressed){
          t.pressed = true;
          Sfx.ui();
          pressButton(t.id);
        } else if (!on){
          t.pressed = false;
        }
        break;
      }

      /* ---- FAKE DOOR ---- */
      case 'fakedoor': {
        if (!t.gone && overlap(player, { x:t.x, y:t.y, w:24, h:32 })){
          t.gone = true;
          t.timer = 0;
          Sfx.click();
          spawnDust(t.x + 12, t.y + 16, 8, '#00ff66');
        }
        if (t.gone) t.timer += dt;
        break;
      }

      /* ---- AMBUSH SPIKE ---- */
      case 'ambush': {
        if (!t.triggered){
          const pcx = player.x + player.w/2;
          if (Math.abs(pcx - t.triggerX) < 35){
            t.triggered = true;
            t.timer = 0;
            Sfx.click();
            shake = Math.max(shake, 5);
          }
        }
        if (t.triggered){
          t.timer += dt;
          t.h01 = Math.min(1, t.timer / 0.06);
        }
        break;
      }

      /* ---- CRUMBLE PLATFORM ---- */
      case 'crumble': {
        if (t.gone) break;
        if (!t.stepped && overlap(player, t)){
          t.stepped = true;
          t.timer = 0;
          Sfx.click();
        }
        if (t.stepped && !t.collapsed){
          t.timer += dt;
          if (t.timer > 0.5){
            t.collapsed = true;
            t.vy = 0;
            spawnDust(t.x + t.w/2, t.y + t.h, 8, '#c0c0c0');
            Sfx.thud();
          }
        }
        if (t.collapsed){
          t.vy = Math.min(t.vy + GRAV * 1.4, 16);
          t.y += t.vy;
          if (t.y > H + 120) t.gone = true;
        }
        break;
      }
    }
  }
}

/* ============================================================
   HAZARDS + DOOR CHECK
   ============================================================ */
function checkHazards(){
  for (const h of level.hazards){
    if (overlap(player, h)) return kill();
  }
  for (const t of level.traps){
    if (t.type === 'crush'){
      if (overlap(player, t)) return kill();
    } else if (t.type === 'jump' && t.h01 > 0.15){
      const hh = t.h * t.h01;
      if (overlap(player, { x:t.x, y:t.baseY - hh, w:t.w, h:hh })) return kill();
    } else if (t.type === 'ambush' && t.h01 > 0.5){
      const hh = t.h * t.h01;
      if (overlap(player, { x:t.x, y:t.baseY - hh, w:t.w, h:hh })) return kill();
    }
  }
}

function checkDoor(){
  if (!level.doorOpen) return;
  if (door.state === 'fleeing') return;
  if (!overlap(player, door)) return;

  /* 1. Flee once */
  if (door.state === 'idle' && door.flee){
    door.state = 'fleeing';
    door.ft = 0;
    door.sx = door.x;  door.sy = door.y;
    door.tx = door.flee.x;
    door.ty = door.flee.y;
    Sfx.whoosh();
    return;
  }

  /* 2. Bait once */
  if (level.def.baitDoor && !doorBaited){
    doorBaited = true;
    triggerBaitDoor();
    return;
  }

  /* 3. Actual win */
  win();
}

/* ============================================================
   NIGHTMARE UI / CONTROL WARFARE
   ============================================================ */
function updateNightmare(dt){
  if (levelIndex < 5) return;                 /* stages 6-10 only */
  if (level.t < 2.0) return;                  /* grace after intro */
  if (nightmare.baitFlash > 0){
    nightmare.baitFlash -= dt;
    return;
  }

  if (nightmare.tempInvert > 0){
    nightmare.tempInvert -= dt;
    if (nightmare.tempInvert <= 0){
      nightmare.tempInvert = 0;
      nightmare.tickTimer = 6 + Math.random() * 6;
    }
    return;
  }

  nightmare.tickTimer -= dt;
  if (nightmare.tickTimer > 0) return;

  nightmare.tickTimer = 8 + Math.random() * 7;

  const roll = Math.random();
  if (roll < 0.34){
    /* fake "LEVEL CLEARED" — the ultimate gaslight */
    showBanner('LEVEL CLEARED', 1.4);
    Sfx.win();
  } else if (roll < 0.67){
    /* false death count panic */
    showFakeDeaths(deaths + 55 + Math.floor(Math.random() * 145), 0.85);
    Sfx.click();
  } else {
    /* burst control inversion */
    nightmare.tempInvert = 1.2 + Math.random() * 0.7;
    Sfx.whoosh();
  }
}

/* ============================================================
   MAIN UPDATE (fixed 60Hz step)
   ============================================================ */
function update(){
  const dt = STEP;
  level.t += dt;
  sessionTime += dt;

  if (flash > 0) flash -= dt;
  if (glitch > 0) glitch -= dt;
  if (shake > 0)  shake *= 0.86;
  if (shake < 0.6) shake = 0;

  if (ui.bannerTimer > 0)    ui.bannerTimer -= dt;
  if (ui.fakeDeathTimer > 0) ui.fakeDeathTimer -= dt;

  updateNightmare(dt);

  /* --- door flight animation --- */
  if (door.state === 'fleeing'){
    door.ft += dt;
    const p = Math.min(1, door.ft / 1.05);
    const e = 1 - Math.pow(1 - p, 3);
    door.x = door.sx + (door.tx - door.sx) * e;
    door.y = door.sy + (door.ty - door.sy) * e - Math.sin(p * Math.PI) * 46;
    if (p >= 1) door.state = 'home';
  }

  updateTraps(dt);
  buildSolids();

  /* --- horizontal input --- */
  let dir = 0;
  if (keys['ArrowLeft']  || keys['KeyA']) dir -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) dir += 1;
  if (level.invertControls)       dir = -dir;
  if (nightmare.tempInvert > 0)   dir = -dir;

  if (dir !== 0) player.vx += dir * ACCEL;
  else           player.vx *= FRIC;
  player.vx = clamp(player.vx, -SPEED, SPEED);
  if (Math.abs(player.vx) < 0.06) player.vx = 0;

  /* --- gravity --- */
  player.vy += GRAV * player.gdir;
  if (player.gdir > 0) player.vy = Math.min(player.vy, MAXFALL);
  else                 player.vy = Math.max(player.vy, -MAXFALL);

  /* --- jumps --- */
  if (jumpBuffer > 0) jumpBuffer--;
  if (player.coyote > 0) player.coyote--;

  if (jumpBuffer > 0){
    if (player.grounded || player.coyote > 0){
      doJump(false);
    } else if (player.jumpsLeft > 0){
      doJump(true);
    }
  }

  const held = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];
  if (!held && player.vy * player.gdir < -3) player.vy *= 0.55;

  /* --- integrate --- */
  player.grounded = false;
  moveX(player.vx);
  moveY(player.vy);
  if (player.grounded){
    player.coyote = 6;
    player.jumpsLeft = 2;
  }

  player.x = clamp(player.x, 0, W - player.w);

  /* --- lethal --- */
  if (player.y > H + 70 || player.y < -150){
    kill();
    return;
  }

  checkHazards();
  checkDoor();

  updateParticles();
}

/* ============================================================
   LEVEL SELECT LAYOUT
   ============================================================ */
const LS = { cols:5, rows:2, cw:92, ch:80, gapX:16, gapY:18, x0:0, y0:0 };
(function initLS(){
  const w = LS.cols * LS.cw + (LS.cols - 1) * LS.gapX;
  const h = LS.rows * LS.ch + (LS.rows - 1) * LS.gapY;
  LS.x0 = (W - w) / 2;
  LS.y0 = (H - h) / 2 + 8;
})();
function lsRect(i){
  const c = i % LS.cols, r = Math.floor(i / LS.cols);
  return {
    x: LS.x0 + c * (LS.cw + LS.gapX),
    y: LS.y0 + r * (LS.ch + LS.gapY),
    w: LS.cw, h: LS.ch
  };
}

/* ============================================================
   RENDER HELPERS
   ============================================================ */
function drawBlock(s, color){
  ctx.fillStyle = color || '#c0c0c0';
  ctx.fillRect(s.x, s.y, s.w, s.h);
  ctx.fillStyle = 'rgba(0,0,0,0.20)';
  ctx.fillRect(s.x, s.y + s.h - 3, s.w, 3);
  ctx.strokeStyle = '#2b2b2b';
  ctx.lineWidth = 2;
  ctx.strokeRect(s.x + 1, s.y + 1, s.w - 2, s.h - 2);
}

function drawSpike(x, y, w, h, dir){
  ctx.fillStyle = '#ff2a2a';
  const n = Math.max(1, Math.round(w / 6));
  const step = w / n;
  for (let i = 0; i < n; i++){
    const bx = x + i * step;
    ctx.beginPath();
    if (dir > 0){
      ctx.moveTo(bx, y + h);
      ctx.lineTo(bx + step/2, y);
      ctx.lineTo(bx + step, y + h);
    } else {
      ctx.moveTo(bx, y);
      ctx.lineTo(bx + step/2, y + h);
      ctx.lineTo(bx + step, y);
    }
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,120,120,0.55)';
  ctx.fillRect(x, dir > 0 ? y + h - 2 : y, w, 2);
}

function drawGrave(x, y){
  const gx = Math.round(x - 5);
  const gy = Math.round(y - 13);
  ctx.fillStyle = '#4e4e5a';
  ctx.fillRect(gx, gy + 2, 10, 11);
  ctx.fillRect(gx + 1, gy, 8, 3);
  ctx.fillStyle = '#6a6a78';
  ctx.fillRect(gx + 1, gy, 8, 2);
  ctx.fillStyle = '#1c1c22';
  ctx.fillRect(gx + 4, gy + 4, 2, 7);
  ctx.fillRect(gx + 2, gy + 6, 6, 2);
}

function drawPlayer(){
  const p = player;
  ctx.save();
  if (p.gdir < 0){
    ctx.translate(p.x + p.w/2, p.y + p.h/2);
    ctx.scale(1, -1);
    ctx.translate(-(p.x + p.w/2), -(p.y + p.h/2));
  }
  ctx.fillStyle = '#22cce8';
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.fillStyle = '#8ff2ff';
  ctx.fillRect(p.x, p.y, p.w, 3);
  ctx.fillStyle = '#0a6a80';
  ctx.fillRect(p.x, p.y + p.h - 3, p.w, 3);

  ctx.fillStyle = '#08161c';
  ctx.fillRect(p.x + 3, p.y + 5, 3, 4);
  ctx.fillRect(p.x + p.w - 6, p.y + 5, 3, 4);

  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillRect(p.x + 3, p.y + 5, 1, 1);
  ctx.fillRect(p.x + p.w - 6, p.y + 5, 1, 1);
  ctx.restore();
}

function drawDoorBody(d, wings){
  const pulse = 0.5 + 0.5 * Math.sin(level.t * 6);

  if (wings){
    ctx.fillStyle = '#e8e8f0';
    const flap = Math.sin(level.t * 22) * 6;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y + 8);
    ctx.lineTo(d.x - 14, d.y + 2 + flap);
    ctx.lineTo(d.x - 10, d.y + 18);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(d.x + d.w, d.y + 8);
    ctx.lineTo(d.x + d.w + 14, d.y + 2 - flap);
    ctx.lineTo(d.x + d.w + 10, d.y + 18);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle = '#7a4a22';
  ctx.fillRect(d.x, d.y, d.w, d.h);
  ctx.fillStyle = '#5a3418';
  ctx.fillRect(d.x + 2, d.y + 2, d.w - 4, d.h - 4);
  ctx.fillStyle = '#8f5c2c';
  ctx.fillRect(d.x + 4, d.y + 4, d.w - 8, 10);

  ctx.fillStyle = `rgba(0,255,102,${0.45 + 0.45 * pulse})`;
  ctx.fillRect(d.x + d.w - 7, d.y + d.h/2 - 2, 3, 4);

  ctx.strokeStyle = `rgba(0,255,102,${0.25 + 0.30 * pulse})`;
  ctx.lineWidth = 2;
  ctx.strokeRect(d.x - 2, d.y - 2, d.w + 4, d.h + 4);
}

function drawBanner(){
  if (ui.bannerTimer <= 0) return;
  const elapsed = ui.bannerDur - ui.bannerTimer;
  const a = Math.min(1, elapsed / 0.15) * Math.min(1, ui.bannerTimer / 0.3);

  ctx.globalAlpha = 0.78 * a;
  ctx.fillStyle = '#08080c';
  ctx.fillRect(0, H/2 - 52, W, 104);

  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = 'bold 30px "Courier New", monospace';
  ctx.fillStyle = '#00ff66';
  ctx.fillText(ui.banner, W/2, H/2 - 18);

  ctx.font = 'bold 10px "Courier New", monospace';
  ctx.fillStyle = '#4a4a55';
  ctx.fillText('✦ ✦ ✦', W/2, H/2 + 16);

  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  ctx.save();
  if (shake > 0){
    ctx.translate(
      (Math.random() - 0.5) * shake,
      (Math.random() - 0.5) * shake
    );
  }

  /* background */
  ctx.fillStyle = '#121216';
  ctx.fillRect(-30, -30, W + 60, H + 60);

  ctx.fillStyle = 'rgba(255,255,255,0.018)';
  for (let y = 0; y < H; y += 40)
    for (let x = 0; x < W; x += 40)
      ctx.fillRect(x, y, 1, 1);

  /* nightmare vignette on late stages */
  if (levelIndex >= 5){
    const intensity = 0.10 + 0.04 * (levelIndex - 5);
    ctx.fillStyle = `rgba(70,0,0,${intensity})`;
    ctx.fillRect(0, 0, W, 14);
    ctx.fillRect(0, H - 14, W, 14);
    ctx.fillRect(0, 0, 10, H);
    ctx.fillRect(W - 10, 0, 10, H);
  }

  /* static terrain */
  for (const s of staticSolids) drawBlock(s);

  /* gravestones */
  const graves = gravesFor(levelIndex);
  for (let i = 0; i < graves.length; i++) drawGrave(graves[i].x, graves[i].y);

  /* traps */
  for (const t of level.traps){

    if (t.type === 'drop'){
      if (t.gone) continue;
      drawBlock(t, t.falling ? '#9a9a9a' : '#c0c0c0');
    }

    else if (t.type === 'invis'){
      ctx.globalAlpha = t.revealed ? 1 : 0.07;
      drawBlock(t, '#c0c0c0');
      ctx.globalAlpha = 1;
    }

    else if (t.type === 'fake'){
      drawBlock(t, '#c0c0c0');
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.fillRect(t.x, t.y + 2, t.w, 1);
    }

    else if (t.type === 'jump'){
      if (t.h01 <= 0.02){
        ctx.fillStyle = '#5a2020';
        ctx.fillRect(t.x + 4, t.baseY - 3, t.w - 8, 3);
      } else {
        const hh = t.h * t.h01;
        drawSpike(t.x, t.baseY - hh, t.w, hh, 1);
      }
    }

    else if (t.type === 'ambush'){
      if (!t.triggered) continue;
      const hh = t.h * t.h01;
      if (hh < 0.5) continue;
      drawSpike(t.x, t.baseY - hh, t.w, hh, 1);
    }

    else if (t.type === 'crumble'){
      if (t.gone) continue;
      if (t.collapsed){
        drawBlock(t, '#8a8a8a');
      } else if (t.stepped){
        /* flicker for 0.5 s before collapse */
        const flick = Math.sin(t.timer * 55) > 0;
        ctx.globalAlpha = flick ? 1 : 0.35;
        drawBlock(t, flick ? '#c0c0c0' : '#8a8a8a');
        ctx.globalAlpha = 1;
      } else {
        drawBlock(t, '#c0c0c0');
      }
    }

    else if (t.type === 'crush'){
      if (t.y > -120){
        ctx.fillStyle = '#8a1f1f';
        ctx.fillRect(t.x, t.y, t.w, t.h);
        ctx.fillStyle = '#ff2a2a';
        for (let i = 0; i < t.h; i += 20){
          ctx.fillRect(t.x + 4, t.y + i + 4, t.w - 8, 4);
        }
        ctx.strokeStyle = '#2b2b2b';
        ctx.lineWidth = 2;
        ctx.strokeRect(t.x + 1, t.y + 1, t.w - 2, t.h - 2);
      }
    }

    else if (t.type === 'button'){
      const lit = t.pressed;
      ctx.fillStyle = lit ? '#00ff66' : '#3a5a44';
      ctx.fillRect(t.x, t.y, t.w, t.h);
      ctx.strokeStyle = '#2b2b2b';
      ctx.lineWidth = 2;
      ctx.strokeRect(t.x, t.y, t.w, t.h);

      ctx.fillStyle = lit ? '#08160c' : '#8a9a90';
      for (let i = 0; i < t.id; i++){
        ctx.fillRect(t.x + 4 + i * 6, t.y + 2, 3, 2);
      }
    }

    else if (t.type === 'fakedoor'){
      if (t.gone){
        if (t.timer < 0.5){
          const a = 1 - t.timer / 0.5;
          ctx.globalAlpha = a;
          ctx.fillStyle = '#00ff66';
          ctx.fillRect(t.x - 10 * (1-a), t.y - 10 * (1-a), 24 + 20*(1-a), 32 + 20*(1-a));
          ctx.globalAlpha = 1;
        }
        continue;
      }
      ctx.globalAlpha = 0.9;
      drawDoorBody({ x:t.x, y:t.y, w:24, h:32 }, false);
      ctx.globalAlpha = 1;
    }

    else if (t.type === 'grav'){
      ctx.fillStyle = 'rgba(120,60,255,0.05)';
      ctx.fillRect(t.x, t.y, t.w, t.h);
    }
  }

  /* static grid hazards */
  for (const h of level.hazards) drawSpike(h.x, h.y, h.w, h.h, 1);

  /* door */
  if (level.doorOpen) drawDoorBody(door, door.state === 'fleeing');

  /* player */
  drawPlayer();

  /* particles */
  for (const p of particles){
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  /* ---------- HUD ---------- */
  ctx.textBaseline = 'top';
  ctx.font = 'bold 11px "Courier New", monospace';
  ctx.textAlign = 'left';

  ctx.fillStyle = '#c0c0c0';
  ctx.fillText('STAGE ' + String(levelIndex + 1).padStart(2, '0'), 12, 10);

  /* fake death counter override */
  const shownDeaths = ui.fakeDeathTimer > 0 ? ui.fakeDeathVal : deaths;
  ctx.fillStyle = ui.fakeDeathTimer > 0 ? '#ff6a6a' : '#ff2a2a';
  ctx.fillText('DEATHS: ' + shownDeaths, 12, 25);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#00ff66';
  ctx.fillText(fmtTime(sessionTime), W - 12, 10);

  ctx.fillStyle = '#3f3f4a';
  ctx.fillText('ESC: STAGES   M: ' + (Sfx.isMuted() ? 'SILENT' : 'SOUND'), W - 12, 25);
  ctx.fillText('R: RETRY', W - 12, 40);
  ctx.textAlign = 'left';

  /* nightmare temp-invert indicator */
  if (nightmare.tempInvert > 0){
    const a = 0.30 + 0.25 * Math.sin(performance.now() * 0.024);
    ctx.fillStyle = `rgba(255,30,80,${a})`;
    ctx.fillRect(0, 0, 5, H);
    ctx.fillRect(W - 5, 0, 5, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 9px "Courier New", monospace';
    ctx.fillStyle = `rgba(255,120,120,${a + 0.15})`;
    ctx.fillText('! CONTROLS INVERTED !', W/2, 26);
    ctx.textAlign = 'left';
  }

  /* level intro */
  if (level.t < 2.2){
    const a = level.t < 1.6 ? 1 : (2.2 - level.t) / 0.6;
    ctx.globalAlpha = Math.max(0, a);
    ctx.textAlign = 'center';
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.fillStyle = '#e8e8f0';
    ctx.fillText(LEVELS[levelIndex].name, W/2, 58);
    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.fillStyle = '#4a4a55';
    ctx.fillText('STAGE ' + String(levelIndex + 1).padStart(2,'0'), W/2, 82);
    if (LEVELS[levelIndex].hint){
      ctx.fillStyle = levelIndex >= 5 ? '#7a2a2a' : '#2f6f7a';
      ctx.fillText(LEVELS[levelIndex].hint, W/2, 100);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  /* sequence fail flash */
  if (level.seqFail > 0){
    ctx.fillStyle = `rgba(255,42,42,${level.seqFail * 0.5})`;
    ctx.fillRect(0, 0, W, H);
  }

  /* damage flash */
  if (flash > 0){
    const a = Math.min(0.55, flash);
    ctx.fillStyle = flashCol === '#00ff66'
      ? `rgba(0,255,102,${a * 0.8})`
      : `rgba(255,42,42,${a})`;
    ctx.fillRect(0, 0, W, H);
  }

  /* nightmare glitch overlay */
  if (glitch > 0){
    const a = Math.min(0.55, glitch);
    ctx.fillStyle = `rgba(255,20,80,${a * 0.55})`;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = `rgba(0,220,255,${a * 0.30})`;
    ctx.fillRect((Math.random() - 0.5) * 8, 0, W, H);
  }

  /* fake banner */
  drawBanner();

  /* overlays */
  if (gameState === 'select')      drawLevelSelect();
  else if (gameState === 'victory') drawVictory();
}

/* ============================================================
   OVERLAY : LEVEL SELECT
   ============================================================ */
function drawLevelSelect(){
  ctx.fillStyle = 'rgba(8,8,12,0.93)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';

  ctx.font = 'bold 20px "Courier New", monospace';
  ctx.fillStyle = '#e8e8f0';
  ctx.fillText('SELECT STAGE', W/2, 40);

  ctx.font = 'bold 9px "Courier New", monospace';
  ctx.fillStyle = '#4a4a55';
  ctx.fillText('CLICK OR PRESS 1-0   •   ESC TO RESUME', W/2, 66);

  for (let i = 0; i < LEVELS.length; i++){
    const r = lsRect(i);
    const open = i < unlocked;
    const hover = open &&
      mouse.x >= r.x && mouse.x <= r.x + r.w &&
      mouse.y >= r.y && mouse.y <= r.y + r.h;

    ctx.fillStyle = open ? (hover ? '#1c2b33' : '#151519') : '#101014';
    ctx.fillRect(r.x, r.y, r.w, r.h);

    ctx.lineWidth = 2;
    ctx.strokeStyle = open ? (hover ? '#00ff66' : '#3a3a46') : '#222229';
    ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);

    ctx.font = 'bold 24px "Courier New", monospace';
    ctx.fillStyle = open ? (hover ? '#00ff66' : '#c0c0c0') : '#2e2e38';
    ctx.fillText(String(i + 1).padStart(2, '0'), r.x + r.w/2, r.y + 22);

    ctx.font = 'bold 8px "Courier New", monospace';
    ctx.fillStyle = open ? '#5a5a68' : '#26262e';
    ctx.fillText(open ? LEVELS[i].name : 'LOCKED', r.x + r.w/2, r.y + 54);
  }

  ctx.font = 'bold 9px "Courier New", monospace';
  ctx.fillStyle = '#3a3a44';
  ctx.fillText('HOLD SHIFT WHILE OPENING THIS SCREEN TO UNLOCK ALL (TESTING)', W/2, H - 26);

  ctx.textAlign = 'left';
}

/* ============================================================
   OVERLAY : VICTORY
   ============================================================ */
function drawVictory(){
  ctx.fillStyle = 'rgba(8,8,10,0.90)';
  ctx.fillRect(0, 0, W, H);

  const rageScore = Math.round(deaths * sessionTime);

  ctx.textAlign = 'center';

  ctx.font = 'bold 26px "Courier New", monospace';
  ctx.fillStyle = '#00ff66';
  ctx.fillText('YOU BEAT THE NIGHTMARE', W/2, 96);

  ctx.font = 'bold 11px "Courier New", monospace';
  ctx.fillStyle = '#c0c0c0';
  ctx.fillText('TOTAL DEATHS: ' + deaths, W/2, 152);
  ctx.fillText('TOTAL TIME:   ' + fmtTime(sessionTime), W/2, 172);

  ctx.font = 'bold 18px "Courier New", monospace';
  ctx.fillStyle = '#ff2a2a';
  ctx.fillText('RAGE SCORE', W/2, 210);
  ctx.font = 'bold 22px "Courier New", monospace';
  ctx.fillStyle = '#ff6a4a';
  ctx.fillText(String(rageScore), W/2, 232);

  ctx.font = 'bold 10px "Courier New", monospace';
  ctx.fillStyle = '#4a4a55';
  ctx.fillText('PRESS R TO RUN IT AGAIN   •   ESC FOR STAGE SELECT', W/2, 288);

  ctx.textAlign = 'left';
}

/* ============================================================
   TIME FORMAT
   ============================================================ */
function fmtTime(t){
  const m  = Math.floor(t / 60);
  const s  = Math.floor(t % 60);
  const ms = Math.floor((t % 1) * 1000);
  return String(m).padStart(2,'0') + ':' +
         String(s).padStart(2,'0') + '.' +
         String(ms).padStart(3,'0');
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let acc = 0;
let last = performance.now();

function loop(now){
  requestAnimationFrame(loop);

  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;

  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 8){
    if (gameState === 'play') update();
    acc -= STEP;
  }

  render();
}

/* ============================================================
   BOOT
   ============================================================ */
buildLevel();
requestAnimationFrame(loop);

</script>
